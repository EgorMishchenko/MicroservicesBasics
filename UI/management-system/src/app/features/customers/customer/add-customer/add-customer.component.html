<div class="container">
  <h1 class="mt-3">Add Category</h1>
  <form #form="ngForm" (ngSubmit)="onCustomerCreate()">
    <div class="mt-2">

      <div class="mt-3">
        <label class="form-label">First Name</label>
        <input type="text" id="CustomerFirstName" class="form-control" name="CustomerFirstName" [(ngModel)]="model.firstname">
      </div>

      <div class="mt-3">
        <label class="form-label">Last Name</label>
        <input type="text" id="CustomerLastName" class="form-control" name="CustomerLastName" [(ngModel)]="model.lastname">
      </div>

      <div class="mt-3">
        <label class="form-label">Birthday</label>
        <input type="text" id="CustomerBirthday" class="form-control" name="CustomerBirthday"[(ngModel)]="model.birthday">
      </div>

      <div class="mt-3">
        <label class="form-label">Email</label>
        <input type="text" id="CustomerEmail" class="form-control" name="CustomerEmail" [(ngModel)]="model.email">
      </div>

      <div class="mt-3">
        <label class="form-label">Address</label>
        <input type="text" id="CustomerAddress" class="form-control" name="CustomerAddress" [(ngModel)]="model.address">
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </div>
  </form>
</div>
