<div class="container">
  <h1 class="mt-3">Customers List</h1>
  <div class="d-flex justify-content-end mt-3">
    <a class="btn btn-primary" [routerLink]="['/admin/add-customer']">Add Customer</a>
  </div>
  <ng-container *ngIf="customers$ | async as customers">
    <table class="table table-bordered mt-3">
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Birthday</th>
          <th>Email</th>
          <th>Address</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of customers$ | async">
          <td>{{ customer.firstname }}</td>
          <td>{{ customer.lastname }}</td>
          <td>{{ customer.birthday }}</td>
          <td>{{ customer.email }}</td>
          <td>{{ customer.address }}</td>
          <td>
            <a
              [routerLink]="['/admin/customer', category.id]"
              class="btn btn-light"
              >Edit</a
            >
          </td>
        </tr>
      </tbody>
    </table>
  </ng-container>

</div>
